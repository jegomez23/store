# Configuración para `supabase` CLI (stack local con Docker).
# Validado en Fase 4.5 contra el proyecto Supabase real vía `supabase link`
# + `supabase db push` (el stack LOCAL sigue sin probarse: este entorno no
# tiene Docker). `major_version` alineada con la del proyecto real
# (PostgreSQL 17.6) para que el stack local reproduzca producción.

project_id = "yi-store"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]

[storage]
enabled = true
file_size_limit = "5MiB"
