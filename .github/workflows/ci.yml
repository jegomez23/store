name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      # Desde Fase 4, Home y /producto/[slug] usan generateStaticParams +
      # fetch real a Supabase en build-time (docs/02-ARCHITECTURE.md §3):
      # el build FALLA sin un proyecto Supabase real y accesible con las
      # migraciones/seed de supabase/ aplicadas. Configurar como repo
      # secrets antes de que este workflow pueda pasar en verde.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MARKET: ES
          NEXT_PUBLIC_SITE_URL: https://example.com
